<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="robots" content="noindex" />
    <title>暂时连不上网络 · 重大虎溪小助手</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f7fb;
        color: #1b1c1e;
        font-family:
          system-ui,
          -apple-system,
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        line-height: 1.6;
      }
      main {
        width: min(420px, 100%);
        padding: 28px 24px;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(16, 32, 64, 0.08);
      }
      .badge {
        display: inline-block;
        margin: 0 0 12px;
        padding: 2px 10px;
        border-radius: 999px;
        background: #eef3ff;
        color: #0b57d0;
        font-size: 12px;
        font-weight: 600;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        line-height: 1.35;
      }
      p {
        margin: 0 0 14px;
        color: #4a4d52;
        font-size: 15px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 20px 0 16px;
      }
      .actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
      }
      .primary {
        background: #0b57d0;
        color: #ffffff;
      }
      .secondary {
        border: 1px solid #d7dce6;
        color: #1b1c1e;
        background: #ffffff;
      }
      .tip {
        margin-bottom: 0;
        font-size: 13px;
        color: #66666b;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #101114;
          color: #f2f3f5;
        }
        main {
          background: #1b1d21;
          box-shadow: none;
        }
        .badge {
          background: #1d2c4a;
          color: #a8c7ff;
        }
        p {
          color: #c3c6cc;
        }
        .tip {
          color: #9aa0a8;
        }
        .secondary {
          border-color: #33363c;
          background: #1b1d21;
          color: #f2f3f5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="badge">离线</p>
      <h1>现在没有网络，这个页面也还没缓存</h1>
      <p>
        小助手的页面第一次打开需要联网。连上网络后再点一次即可；已经看过的页面通常还能离线打开。
      </p>
      <div class="actions">
        <a class="primary" href="">再试一次</a>
        <a class="secondary" href="./index.html">回到首页</a>
      </div>
      <p class="tip">课表、考试、待办与备份都存在这台设备上，不会因为断网丢失。</p>
    </main>
  </body>
</html>
